version: 3.2

project:
  name: "replace-me"
  type: "unknown"
  architecture: "unknown"

validation:
  build: ""
  unit_test: ""
  integration_test: ""
  contract_test: ""
  static_analysis: ""

risk:
  critical_domains:
    - "money movement"
    - "inventory mutation"
    - "authorization decision"
    - "sensitive data handling"
  public_contract_locations: []
  migration_locations: []
  shared_infrastructure_locations: []

delivery:
  rollback: "unknown"
  observability: "unknown"
  deployment_strategy: "unknown"

workflow:
  default_mode: "standard"
  allow_fast_mode: true
  openspec_from: "standard"
  plannotator_plan_review_from: "standard"
  plannotator_code_review_from: "governed"

state:
  persist_from: "standard"
