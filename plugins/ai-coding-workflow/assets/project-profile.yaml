version: 3.3.0

profile_status: "unconfigured"

project:
  name: "replace-me"
  type: "unknown"
  architecture: "unknown"

validation:
  build: ""
  unit_test: ""
  integration_test: ""
  contract_test: ""
  static_analysis: ""
  security_scan: ""

risk:
  critical_domains:
    - "money movement"
    - "inventory mutation"
    - "authorization decision"
    - "sensitive data handling"
  public_contract_locations: []
  migration_locations: []
  shared_infrastructure_locations: []

delivery:
  rollback: "unknown"
  observability: "unknown"
  deployment_strategy: "unknown"

workflow:
  default_mode: "standard"
  allow_fast_mode: true
  openspec_from: "standard"
  plannotator_spec_diff_review_from: "standard"
  plannotator_code_diff_review_from: "governed"
  feature_min_mode: "standard"

execution_policy:
  fast:
    planning_depth: "concise"
    validation_scope: "targeted"
    isolation: "current-worktree"
    review_policy: "none"
    execution_strategy: "sequential"
  standard:
    planning_depth: "normal"
    validation_scope: "affected"
    isolation: "isolate-if-dirty"
    review_policy: "spec-diff"
    execution_strategy: "sequential"
  governed:
    planning_depth: "extensive"
    validation_scope: "full"
    isolation: "mandatory-worktree"
    review_policy: "spec-and-code-diff"
    execution_strategy: "dependency-parallel"

state:
  persist_from: "fast"
  file_name: "workflow-state.json"
  schema: ".codex/ai-coding-workflow/workflow-state.schema.json"
  fast_directory: ".codex/ai-coding-workflow/workflow-runs"
  resume_incomplete: true

runtime:
  command: "node <plugin-root>/scripts/workflow-runtime.mjs --host codex"
  hooks: "由 Codex 插件提供：hooks/hooks.json"
  hooks_installed: true
  hook_profile: "default"

# ai-coding-workflow-setup:start
setup:
  status: "unchecked"
  checked_at: ""
  node: false
  node_version: ""
  node_supported: false
  superpowers_plugin: false
  openspec_cli: false
  openspec_skills: false
  plannotator_cli: false
  hooks_trust: "manual"
# ai-coding-workflow-setup:end

autonomy:
  route_requires_confirmation: false
  internal_steps_require_confirmation: false
  local_changes_authorized: true
  local_validation_authorized: true
  openspec_lifecycle_authorized: true

notes:
  - "首次接入时，用真实命令、关键目录和交付能力替换空值或 unknown。"
  - "profile_status 不是 ready 时禁止 Fast；先完成项目画像，再运行新任务。"
  - "Codex 插件内置 SessionStart、Stop 和 PreToolUse；PreToolUse 仅在 hook_profile 为 strict 时执行拦截。"
  - "安装插件后需在 Codex 中审查并信任 Hook；切换 default/strict 只修改 hook_profile，无需重装。"
  - "setup 状态由 scripts/setup-check.mjs 维护；缺失依赖时使用 $ai-coding-workflow-setup 集中修复。"
  - "profile 只存项目事实和授权边界，不复制路由、组合规则或节点状态。"
