name: Validate workflow template

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate Composable runtime
        run: python scripts/validate_workflow.py
      - name: Evaluate composable routing
        run: python scripts/evaluate_routing.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: python scripts/build_distribution.py --output dist/ai-coding-workflow-template.zip
      - name: Validate distribution
        run: python scripts/validate_workflow.py --archive dist/ai-coding-workflow-template.zip
